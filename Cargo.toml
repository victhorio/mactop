[package]
name = "mactop"
version = "0.1.0"
edition = "2024"
description = "A CPU and memory-first terminal monitor for Apple Silicon"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
compact_str = "0.9"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation-sys = "0.8"
mach2 = "0.7"

[profile.release]
lto = "thin"
strip = true
