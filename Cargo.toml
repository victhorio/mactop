[package]
name = "mactop"
version = "0.1.0"
edition = "2024"
description = "A CPU and memory-first terminal monitor for Apple Silicon"
publish = false

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"] }

[profile.release]
lto = "thin"
strip = true
